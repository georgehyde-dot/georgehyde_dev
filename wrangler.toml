name = "georgehyde-dev"
main = "@astrojs/cloudflare/entrypoints/server"
keep_vars = true
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

# Custom domain routing
routes = [
    { pattern = "georgehyde.dev/*", zone_name = "georgehyde.dev" },
    { pattern = "georgehyde.dev", custom_domain = true },
]

[assets]
directory = "./dist"

# Environment variables
[vars]
ENVIRONMENT = "production"
# Public Clerk key — safe to commit, it's a browser-facing publishable key (not the secret key)
PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_Y29ycmVjdC13aGlwcGV0LTg5LmNsZXJrLmFjY291bnRzLmRldiQ"

[[kv_namespaces]]
binding = "BLOG_POSTS"
id = "63647b278c2345e6a6f252cef09ef8ee"

# Required by @astrojs/cloudflare for Clerk session storage
[[kv_namespaces]]
binding = "SESSION"
id = "55890dbab69144b4bfe60543c5f3ddbb"

[observability.logs]
enabled = true
invocation_logs = true
